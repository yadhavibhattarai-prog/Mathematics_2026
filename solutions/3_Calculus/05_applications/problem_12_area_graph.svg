<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="title description">
  <title id="title">Area function for the exhibition room</title>
  <desc id="description">The downward-opening parabola A of x equals 60x minus 1.2x squared on the open interval from 0 to 50. Open circles mark excluded endpoints at (0, 0) and (50, 0). The maximum is marked at (25, 750).</desc>
  <rect width="800" height="520" fill="white"/>
  <text x="400" y="30" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="600" fill="#222">Area of the room: A(x) = 60x − 1.2x²</text>

  <g stroke="#d9dee7" stroke-width="1">
    <line x1="100" y1="70" x2="700" y2="70"/>
    <line x1="100" y1="150" x2="700" y2="150"/>
    <line x1="100" y1="230" x2="700" y2="230"/>
    <line x1="100" y1="310" x2="700" y2="310"/>
    <line x1="100" y1="390" x2="700" y2="390"/>
    <line x1="220" y1="70" x2="220" y2="390"/>
    <line x1="340" y1="70" x2="340" y2="390"/>
    <line x1="460" y1="70" x2="460" y2="390"/>
    <line x1="580" y1="70" x2="580" y2="390"/>
  </g>

  <g stroke="#303846" stroke-width="2">
    <line x1="100" y1="390" x2="710" y2="390"/>
    <line x1="100" y1="400" x2="100" y2="60"/>
  </g>

  <g font-family="sans-serif" font-size="14" fill="#303846">
    <text x="88" y="395" text-anchor="end">0</text>
    <text x="88" y="315" text-anchor="end">200</text>
    <text x="88" y="235" text-anchor="end">400</text>
    <text x="88" y="155" text-anchor="end">600</text>
    <text x="88" y="75" text-anchor="end">800</text>
    <text x="100" y="414" text-anchor="middle">0</text>
    <text x="220" y="414" text-anchor="middle">10</text>
    <text x="340" y="414" text-anchor="middle">20</text>
    <text x="460" y="414" text-anchor="middle">30</text>
    <text x="580" y="414" text-anchor="middle">40</text>
    <text x="700" y="414" text-anchor="middle">50</text>
    <text x="400" y="452" text-anchor="middle" font-size="16">Width x (m)</text>
    <text x="24" y="230" text-anchor="middle" font-size="16" transform="rotate(-90 24 230)">Area A(x) (m²)</text>
  </g>

  <path d="M 100 390 Q 400 -210 700 390" fill="none" stroke="#1769aa" stroke-width="4" stroke-linecap="round"/>
  <circle cx="100" cy="390" r="6" fill="white" stroke="#1769aa" stroke-width="3"/>
  <circle cx="700" cy="390" r="6" fill="white" stroke="#1769aa" stroke-width="3"/>
  <circle cx="400" cy="90" r="6" fill="#d1495b" stroke="white" stroke-width="2"/>
  <line x1="400" y1="90" x2="468" y2="75" stroke="#d1495b" stroke-width="1.5"/>
  <text x="475" y="73" font-family="sans-serif" font-size="15" font-weight="600" fill="#a52c3b">(25, 750), maximum</text>
  <text x="400" y="490" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Feasible domain: 0 &lt; x &lt; 50; hollow endpoints are not included.</text>
</svg>
